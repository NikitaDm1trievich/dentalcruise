  - divider: true

  # ── Прайс-лист ───────────────────────────────────────────────────────
  - name: price-list
    label: Прайс-лист
    icon: payments
    folder: src/content/price-list
    extension: json
    format: json
    create: true
    slug: '{{fields.slug}}'
    identifier_field: category
    summary: '{{category}}'
    description: >-
      Страница «Прайс-лист», один файл на направление. Названия и порядок
      разделов задаются в «Главная страница» → «4. Услуги — разделы и цены».
    fields:
      - name: category
        label: Название в списке редактора
        widget: string
        hint: >-
          На сайте заголовок раздела берётся из «Главная страница» → «4. Услуги
          — разделы и цены».
      - { name: note, label: Текст под разделом, widget: text, required: false, hint: Необязательно. }
      - name: groups
        label: Группы позиций
        label_singular: группа
        widget: list
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Название группы, widget: string }
          - name: items
            label: Позиции
            label_singular: позиция
            widget: list
            summary: '{{fields.title}} — {{fields.price}}'
            fields:
              - { name: title, label: Название, widget: string }
              - { name: price, label: Цена, widget: string }
              - name: was
                label: Старая цена
                widget: string
                required: false
                hint: Если заполнить, цена покажется со скидкой и меткой «Акция».
              - { name: note, label: Мелкий текст под названием, widget: string, required: false }
              - name: promo
                label: Метка «Акция» без скидки
                widget: boolean
                default: false
                required: false
                hint: Нужна, только если старой цены нет. Со старой ценой метка появится сама.
      # Порядок разделов прайса берётся из «4. Услуги — разделы и цены»,
      # это поле сайт не читает. Скрыто, но значение в файле сохраняется.
      - { name: order, widget: hidden, default: 100 }
      - name: slug
        label: 'Служебное: адрес раздела'
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Только латинские буквы в нижнем регистре, цифры и дефис']
        hint: >-
          Совпадает с «Служебное: адрес раздела в прайсе» у раздела в «4.
          Услуги — разделы и цены». Латиницей, у существующих не менять.

  # ── Страницы отдельных услуг ─────────────────────────────────────────
  - name: service-pages
    label: Страницы услуг
    icon: medical_services
    folder: src/content/service-pages
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    # _template.json — заготовка для разработчика, на сайт не попадает.
    # У неё в «Раздел прайса» пояснение по-русски, у настоящих страниц —
    # латинский слаг: по этому признаку шаблон и прячем из списка.
    filter: { field: category, pattern: '^[a-z0-9-]+$' }
    description: >-
      Отдельные страницы услуг. Адрес страницы берётся из названия при
      создании и потом не меняется.
    fields:
      - name: title
        label: Название услуги
        widget: string
        hint: Крупный заголовок страницы. При создании из него получается адрес страницы.
      - { name: lead, label: Текст под заголовком, widget: text }
      - name: category
        label: Раздел прайса
        widget: select
        hint: Куда ведёт кнопка «В прайс-лист» и в каком разделе прайса ищется цена.
        options:
          - { label: Эстетическая реставрация, value: restoration }
          - { label: Протезирование, value: protezirovanie }
          - { label: Имплантация, value: implantacia }
          - { label: Хирургия, value: hirurgiya }
          - { label: Терапия, value: terapiya }
          - { label: Гигиена и отбеливание, value: gigiena }
      - { name: price, label: Цена, widget: string, required: false }
      - { name: priceNote, label: Мелкий текст под ценой, widget: string, required: false }
      - { name: duration, label: Сроки, widget: string, required: false, hint: 'Например, «2 визита, 7–10 дней».' }
      - { name: warranty, label: Гарантия, widget: string, required: false }
      - { name: photo, label: Фото работы, widget: image, required: false }
      - name: photoLabel
        label: Надпись вместо фото
        widget: string
        required: false
        default: Здесь фото работы
        hint: Видна, пока фото нет.
      - name: includes
        label: Что входит в цену
        label_singular: пункт
        widget: list
        required: false
        field: { name: item, label: Пункт, widget: string }
      - name: indications
        label: Когда подходит
        label_singular: пункт
        widget: list
        required: false
        field: { name: item, label: Пункт, widget: string }
      - name: steps
        label: Этапы работы
        label_singular: этап
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Название этапа, widget: string }
          - { name: text, label: Описание, widget: text }
      - name: prices
        label: Таблица цен на странице
        label_singular: позиция
        widget: list
        required: false
        summary: '{{fields.title}} — {{fields.price}}'
        hint: Необязательно. Если пусто, таблицы на странице нет.
        fields:
          - { name: title, label: Название, widget: string }
          - { name: price, label: Цена, widget: string }
          - name: was
            label: Старая цена
            widget: string
            required: false
            hint: Если заполнить, цена покажется со скидкой и меткой «Акция».
          - { name: note, label: Мелкий текст под названием, widget: string, required: false }
          - name: promo
            label: Метка «Акция» без скидки
            widget: boolean
            default: false
            required: false
            hint: Нужна, только если старой цены нет. Со старой ценой метка появится сама.
      - name: faq
        label: Вопросы по услуге
        label_singular: вопрос
        widget: list
        required: false
        summary: '{{fields.q}}'
        fields:
          - { name: q, label: Вопрос, widget: string }
          - { name: a, label: Ответ, widget: text }
      - name: seoTitle
        label: Заголовок для поиска
        widget: string
        required: false
        hint: Если пусто, собирается сам. До ~60 знаков — длиннее поисковик обрежет.
      - name: seoDescription
        label: Описание для поиска
        widget: text
        required: false
        hint: Если пусто, собирается само. До ~160 знаков — длиннее поисковик обрежет.
      - name: order
        label: Порядок на странице
        widget: number
        value_type: int
        default: 100
        hint: >-
          Чем меньше число, тем выше. Удобно шагом 10: 10, 20, 30 — так можно
          вставить запись между соседними.
      - name: matchTitle
        label: 'Служебное: название в прайсе'
        widget: string
        required: false
        hint: Заполнять, только если в прайсе позиция называется иначе, чем страница.
      - name: matchGroup
        label: 'Служебное: группа в прайсе'
        widget: string
        required: false
        hint: >-
          Заполнять, только если такое название есть в нескольких группах
          прайса: укажите группу этой страницы.

  # ── Врачи ────────────────────────────────────────────────────────────
  - name: doctors
    label: Врачи
    icon: stethoscope
    folder: src/content/doctors
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: "{{name}} — {{speciality}}{{featured | ternary(' · на главной', '')}}"
    description: >-
      Страница «Врачи» и личные страницы врачей. Галочка «Показывать на
      главной» выводит врача в блок «6. Врачи» на главной.
    fields:
      - { name: name, label: ФИО, widget: string, hint: 'Как на сайте, полностью.' }
      - { name: speciality, label: Специальность, widget: string }
      - name: experience
        label: Стаж
        widget: string
        hint: 'Без слова «стаж»: на сайте оно добавляется само. Например, «6 лет».'
      - name: note
        label: Короткий факт о враче
        widget: text
        hint: >-
          На главной — строка на обороте карточки после стажа, на странице
          «Врачи» — подпись под специальностью.
      - name: extra
        label: Ещё один факт на обороте карточки
        widget: text
        required: false
        hint: Необязательно. Показывается только на главной.
      - { name: photo, label: Фото, widget: image, required: false }
      - name: photoLabel
        label: Надпись вместо фото
        widget: string
        required: false
        default: Здесь фото врача
        hint: Видна, пока фото не загружено.
      - name: featured
        label: Показывать на главной
        widget: boolean
        default: false
        hint: Врач появится в блоке «6. Врачи» на главной.
      - name: about
        label: 'О враче: абзацы'
        label_singular: абзац
        widget: list
        required: false
        hint: Личная страница врача.
        field: { name: item, label: Абзац, widget: text }
      - name: education
        label: Образование и курсы
        label_singular: запись
        widget: list
        required: false
        summary: '{{fields.year}} {{fields.text | truncate(60)}}'
        fields:
          # Год необязателен: у курсов даты обычно нет, выдумывать её нельзя.
          # С обязательным годом такую запись врача не сохранить вовсе.
          - { name: year, label: Год, widget: string, required: false }
          - { name: text, label: Что именно, widget: string }
      - name: skills
        label: 'Что делает: пункты'
        label_singular: пункт
        widget: list
        required: false
        field: { name: item, label: Пункт, widget: string }
      - name: services
        label: Услуги врача
        widget: relation
        collection: service-pages
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: Выберите страницы услуг, которые ведёт врач. Они появятся на его личной странице.
      - name: servicesMore
        label: Крупная надпись под услугами
        widget: string
        required: false
        hint: >-
          Где на сайте: крупно под карточками услуг на странице врача. Чтобы
          пациент не решил, что врач делает только перечисленное, например
          «И другие виды протезирования». Пусто — надписи нет.
      - name: seoTitle
        label: Заголовок для поиска
        widget: string
        required: false
        hint: Если пусто, собирается сам из ФИО, специальности и стажа. До ~60 знаков.
      - name: seoDescription
        label: Описание для поиска
        widget: text
        required: false
        hint: Если пусто, собирается само. До ~160 знаков — длиннее поисковик обрежет.
      - name: order
        label: Порядок на странице
        widget: number
        value_type: int
        default: 100
        hint: >-
          Чем меньше число, тем выше. Удобно шагом 10: 10, 20, 30 — так можно
          вставить запись между соседними.

  - divider: true

  # ── Шапка, подвал и контакты ─────────────────────────────────────────
  # То, что стоит на всех страницах: контакты клиники (один источник для
  # шапки, подвала, «Контактов», нижней панели, формы и микроразметки),
  # меню, общие блоки и форма записи.
  - name: site
    label: Шапка, подвал и контакты
    icon: web
    description: >-
      Общее для всех страниц: телефон, адрес, режим работы, ссылки на
      мессенджеры и карты, меню шапки и подвала, нижняя панель на телефоне,
      форма записи. Меняется сразу на всём сайте.
    files:
      - name: clinic
        label: Контакты и реквизиты клиники
        file: src/data/clinic.json
        fields:
          - name: name
            label: Название клиники
            widget: string
            hint: >-
              Где на сайте: карточка с адресом, подвал, окно лицензии,
              политика конфиденциальности и описание клиники для поисковиков.
          - name: legalName
            label: Название организации для Яндекса
            widget: string
            hint: Уходит в выгрузки для Яндекс Услуг, на страницах не видно.
          - name: description
            label: Описание клиники для поисковиков
            widget: text
            hint: Видят только поисковики (разметка организации на главной).
          - name: phone
            label: Телефон
            widget: string
            pattern:
              ['^\+?[\d\s()-]{10,20}$', 'Номер целиком, с кодом: +7 925 577-76-77 или +375 29 123-45-67']
            hint: >-
              Как его читают люди: +7 925 577-76-77. Ссылка «позвонить» и номер
              для поисковиков собираются из него сами. Стоит в шапке, меню,
              подвале, карточке с адресом, форме записи и на кнопках звонка.
          - { name: email, label: Почта, widget: string }
          - name: address
            label: Адрес
            widget: object
            collapsed: true
            fields:
              - name: street
                label: Улица, дом, этаж
                widget: string
                hint: Полный адрес в карточке, меню, подвале и на «Контактах».
              - name: streetShort
                label: Короткий адрес
                widget: string
                hint: В шапке сайта и в подписи под картой.
              - { name: locality, label: Город, widget: string }
              - { name: region, label: Регион, widget: string }
              - name: postalCode
                label: Почтовый индекс
                widget: string
                required: false
                hint: Пусто — никуда не выводится. Вписывать только настоящий.
              - name: country
                label: 'Служебное: код страны'
                widget: string
                hint: Для поисковиков, латиницей — RU.
          - name: metro
            label: Метро одной строкой
            widget: string
            hint: В подписи под картой, например «м. Полежаевская».
          - name: metroStations
            label: Станции метро
            label_singular: станция
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            hint: Знак метро и станции с кружками цвета линий — в меню, подвале, карточке с адресом.
            fields:
              - { name: name, label: Станция, widget: string }
              - { name: line, label: Линия, widget: string, hint: Подсказка при наведении на кружок. }
              - { name: color, label: Цвет линии, widget: color, allowInput: true }
          - name: metroWalk
            label: Сколько идти от метро
            widget: string
            hint: Идёт после станций, например «5 минут пешком».
          - name: scheduleShort
            label: Режим работы коротко
            widget: string
            hint: В шапке и в окне «Заявка отправлена».
          - name: scheduleLong
            label: Режим работы полностью
            widget: string
            hint: В меню, подвале, карточке с адресом и на страницах «Контакты» и врачей.
          - name: openingHours
            label: Часы работы для поисковиков
            label_singular: часы
            widget: list
            collapsed: true
            summary: '{{fields.opens}}–{{fields.closes}}'
            hint: >-
              На странице не видно — по ним Яндекс и Google показывают «открыто
              сейчас». Меняете режим работы выше — поправьте и здесь.
            fields:
              - name: days
                label: Дни
                widget: select
                multiple: true
                options:
                  - { label: Понедельник, value: Mo }
                  - { label: Вторник, value: Tu }
                  - { label: Среда, value: We }
                  - { label: Четверг, value: Th }
                  - { label: Пятница, value: Fr }
                  - { label: Суббота, value: Sa }
                  - { label: Воскресенье, value: Su }
              - { name: opens, label: Открытие, widget: string, pattern: ['^\d{2}:\d{2}$', 'Время как 10:00'] }
              - { name: closes, label: Закрытие, widget: string, pattern: ['^\d{2}:\d{2}$', 'Время как 22:00'] }
          - name: paymentAccepted
            label: Способы оплаты для поисковиков
            widget: string
            hint: На странице не видно, уходит в разметку организации.
          - name: links
            label: Ссылки на мессенджеры, карты и справочники
            widget: object
            collapsed: true
            hint: >-
              Пустая ссылка убирает свою кнопку со всего сайта. Ссылки на
              справочники уходят поисковикам — вписывать только настоящие
              адреса карточек клиники.
            fields:
              - name: max
                label: Max
                widget: string
                required: false
                hint: Кнопки в шапке, меню, подвале, нижней панели, форме записи.
              - { name: vk, label: ВКонтакте, widget: string, required: false }
              - name: telegram
                label: Telegram
                widget: string
                required: false
                hint: Своего Telegram у клиники нет — поле пустое, кнопки нет.
              # Instagram снят с сайта намеренно (Meta признана в РФ
              # экстремистской, реклама там запрещена): поле скрыто, значение
              # в файле сохраняется. См. src/data/site.ts.
              - { name: instagram, widget: hidden }
              - name: yandexOrg
                label: Карточка клиники на Яндекс Картах
                widget: string
                hint: Кнопки «Как добраться», «Смотреть отзывы» и ссылки под картой.
              - name: yandexPin
                label: Точка на Яндекс Картах (короткая ссылка)
                widget: string
                hint: Адрес в шапке и кнопка «Построить маршрут».
              - name: yandexMapWidget
                label: 'Служебное: адрес виджета карты'
                widget: string
                hint: Карта перед подвалом и на «Контактах». Выдаёт конструктор карт Яндекса.
              - name: yandexReviewsWidget
                label: 'Служебное: адрес виджета отзывов'
                widget: string
                hint: Лента отзывов на главной. Выдаёт Яндекс Бизнес.
              - { name: twoGis, label: Карточка в 2ГИС, widget: string, required: false }
              - { name: googleMaps, label: Карточка в Google Картах, widget: string, required: false }
              - { name: prodoctorov, label: Карточка на ПроДокторов, widget: string, required: false }
              - { name: zoon, label: Карточка на Zoon, widget: string, required: false }
          - name: routeImage
            label: Схема проезда картинкой
            widget: image
            required: false
            hint: Открывается кнопкой в карточке с адресом. Пусто — кнопки нет.
          - name: license
            label: Лицензия
            widget: object
            collapsed: true
            hint: >-
              В подвале (миниатюра выписки и строка с номером), в окне лицензии
              и в разметке для поисковиков. Данные — из выписки из реестра
              лицензий Росздравнадзора. Пустое поле никуда не выводится —
              вписывать только данные настоящей лицензии.
            fields:
              - name: title
                label: Название документа
                widget: string
                hint: 'Начало строки в подвале: «Лицензия на осуществление медицинской деятельности № … от …».'
              - name: number
                label: Регистрационный номер
                widget: string
                required: false
                hint: Номер в реестре лицензий, как в выписке — Л041-01137-77/00335542.
              - name: formerNumber
                label: Прежний номер бланка
                widget: string
                required: false
                hint: Номер на бумажном бланке лицензии. Виден в окне лицензии.
              - name: date
                label: Дата предоставления
                widget: string
                required: false
                pattern: ['^\d{2}\.\d{2}\.\d{4}$', 'Дата как 30.10.2019']
                hint: Как в выписке, например 30.10.2019.
              - name: issuer
                label: Лицензирующий орган
                widget: string
                required: false
                hint: Виден в окне лицензии и уходит поисковикам.
              - name: registryUrl
                label: Ссылка на реестр лицензий
                widget: string
                required: false
                hint: 'Ссылка «Проверить в реестре Росздравнадзора» в подвале и в окне лицензии.'
              # Документы лежат отдельно от фото сайта, в public/docs.
              - name: pdf
                label: Выписка из реестра (PDF)
                widget: file
                required: false
                media_folder: /public/docs
                public_folder: /docs
                hint: Открывается миниатюрой в подвале и кнопкой в окне лицензии.
              - name: pdfPreview
                label: Миниатюра выписки для подвала
                widget: image
                required: false
                media_folder: /public/docs
                public_folder: /docs
                hint: >-
                  Картинка первой страницы выписки, вертикальная (3 к 4). Новую
                  выписку загрузили — замените и миниатюру.
              - name: scans
                label: Сканы лицензии
                label_singular: скан
                widget: list
                collapsed: true
                required: false
                summary: '{{fields.title}}'
                hint: >-
                  Листаются в окне лицензии по порядку списка. Нажатием скан
                  открывается целиком в новой вкладке.
                fields:
                  - name: title
                    label: Подпись
                    widget: string
                    hint: >-
                      Видна под сканом и читается незрячим вместо картинки:
                      что это за страница, например «Приложение № 1 к лицензии».
                  - { name: image, label: Скан, widget: image }
          - name: legal
            label: Реквизиты юрлица
            widget: object
            collapsed: true
            hint: >-
              Мелкой строкой внизу подвала и в разметке для поисковиков. Из
              выписки из реестра лицензий. Пустое поле не выводится.
            fields:
              - name: orgName
                label: Короткое название юрлица
                widget: string
                required: false
                hint: 'Как в выписке: ООО «Дентал Круиз». Стоит в строке лицензии и в реквизитах.'
              - name: fullName
                label: Полное название юрлица
                widget: string
                required: false
                hint: На странице не видно — уходит поисковикам.
              - name: inn
                label: ИНН
                widget: string
                required: false
                pattern: ['^\d{10}(\d{2})?$', 'ИНН — 10 цифр у организации']
              - name: ogrn
                label: ОГРН
                widget: string
                required: false
                pattern: ['^\d{13}(\d{2})?$', 'ОГРН — 13 цифр у организации']
          - name: geo
            label: 'Служебное: координаты входа'
            widget: object
            collapsed: true
            hint: Для поисковиков. Меняются, только если клиника переехала.
            fields:
              - { name: lat, label: Широта, widget: number, value_type: float, step: 0.000001 }
              - { name: lng, label: Долгота, widget: number, value_type: float, step: 0.000001 }

      - name: menu
        label: Меню, подвал и нижняя панель
        file: src/data/menu.json
        fields:
          - name: services
            label: Меню «Услуги»
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: первый пункт меню в шапке и в меню на телефоне.
              Разделы внутри — из «Главная страница» → «4. Услуги — разделы и
              цены».
            fields:
              - { name: label, label: Название пункта, widget: string }
              - { name: all, label: Ссылка на весь прайс, widget: string }
          - name: main
            label: Пункты меню
            label_singular: пункт
            widget: list
            collapsed: true
            summary: '{{fields.label}}'
            hint: 'Где на сайте: шапка и меню на телефоне, после «Услуг».'
            fields:
              - { name: label, label: Подпись, widget: string }
              - name: href
                label: Страница
                widget: select
                options:
                  - { label: Главная, value: / }
                  - { label: Прайс-лист, value: /pricelist }
                  - { label: О клинике, value: /about }
                  - { label: Врачи, value: /doctors }
                  - { label: Галерея работ, value: /gallery }
                  - { label: Контакты, value: /contacts }
                  - { label: Политика конфиденциальности, value: /privacy }
                  - { label: 'Главная › Акции', value: '/#promo' }
                  - { label: 'Главная › Услуги', value: '/#services' }
                  - { label: 'Главная › Врачи', value: '/#doctors' }
                  - { label: 'Главная › Почему мы', value: '/#why' }
                  - { label: 'Главная › О клинике', value: '/#about' }
                  - { label: 'Главная › Вопросы', value: '/#faq' }
                  - { label: 'Главная › Отзывы', value: '/#reviews' }
                  - { label: 'Главная › Контакты', value: '/#contacts' }
          - name: burger
            label: Меню на телефоне
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: выезжающее меню (кнопка с тремя полосками). Телефон,
              адрес и почта в нём — из контактов клиники.
            fields:
              - { name: route, label: Ссылка «Как добраться», widget: string }
              - { name: book, label: Кнопка записи, widget: string }
          - name: footer
            label: Подвал
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: тёмный низ всех страниц. Телефон, адрес, режим работы,
