<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/fonts.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/colors.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/typography.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/spacing.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/radius.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/elevation.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/motion.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/base.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/_ds_bundle.js"></script>
</helmet>

<div onMouseEnter="{{ flipOn }}" onMouseLeave="{{ flipOff }}" onClick="{{ flipToggle }}" style="position:relative;width:100%;height:440px;min-width:0;perspective:2000px;cursor:pointer">
  <div style="position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 560ms cubic-bezier(.77,0,.175,1);transform:{{ flipTransform }}">

    <article style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(0deg);overflow:hidden;border-radius:var(--radius-lg);background:var(--surface-card);box-shadow:var(--shadow-md);display:grid;grid-template-rows:1fr auto">
      <div style="position:relative;overflow:hidden">
        <x-import component-from-global-scope="Ds2_2d9e23.PhotoPlaceholder" label="{{ photoLabel }}" ratio="3 / 4" radius="0" dc-props="{{ photoProps }}" hint-size="100%,100%"></x-import>
      </div>
      <div style="display:grid;gap:var(--space-2);align-content:start;padding:var(--space-5)">
        <h3 style="font-size:var(--type-h4);text-transform:none;letter-spacing:0">{{ name }}</h3>
        <p style="color:var(--text-body);font-size:var(--type-small);font-weight:var(--fw-semibold)">{{ speciality }}</p>
        <span style="display:inline-flex;align-items:center;gap:8px;margin-top:var(--space-1);font-size:var(--type-small);font-weight:var(--fw-bold);color:var(--text-accent)">
          <x-import component-from-global-scope="Ds2_2d9e23.Icon" name="repeat-2" size="16" hint-size="16px,16px"></x-import>
          Подробнее — нажмите на карточку
        </span>
      </div>
    </article>

    <div style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);overflow:hidden;border-radius:var(--radius-lg);background:var(--grad-aqua);box-shadow:var(--shadow-lg);display:grid;grid-template-rows:auto 1fr auto;gap:var(--space-4);padding:var(--space-6)">
      <div style="display:grid;gap:var(--space-2)">
        <h3 style="font-size:var(--type-h4);text-transform:none;letter-spacing:0">{{ name }}</h3>
        <p style="color:var(--text-body);font-size:var(--type-small);font-weight:var(--fw-semibold)">{{ speciality }}</p>
      </div>
      <ul style="list-style:none;margin:0;padding:0;display:grid;gap:var(--space-3);align-content:start">
        <li style="display:flex;gap:var(--space-3);align-items:flex-start;font-size:var(--type-small);color:var(--text-body);transition:transform var(--dur-mid) var(--ease-out) 150ms,opacity var(--dur-mid) var(--ease-out) 150ms;opacity:{{ backOpacity }};transform:{{ backShift }}">
          <x-import component-from-global-scope="Ds2_2d9e23.Icon" name="check" size="16" stroke-width="2.6" color="var(--text-accent)" dc-props="{{ checkProps }}" hint-size="16px,16px"></x-import>
          <span>Стаж {{ experience }}</span>
        </li>
        <li style="display:flex;gap:var(--space-3);align-items:flex-start;font-size:var(--type-small);color:var(--text-body);transition:transform var(--dur-mid) var(--ease-out) 200ms,opacity var(--dur-mid) var(--ease-out) 200ms;opacity:{{ backOpacity }};transform:{{ backShift }}">
          <x-import component-from-global-scope="Ds2_2d9e23.Icon" name="check" size="16" stroke-width="2.6" color="var(--text-accent)" dc-props="{{ checkProps }}" hint-size="16px,16px"></x-import>
          <span>{{ note }}</span>
        </li>
        <li style="display:flex;gap:var(--space-3);align-items:flex-start;font-size:var(--type-small);color:var(--text-body);transition:transform var(--dur-mid) var(--ease-out) 250ms,opacity var(--dur-mid) var(--ease-out) 250ms;opacity:{{ backOpacity }};transform:{{ backShift }}">
          <x-import component-from-global-scope="Ds2_2d9e23.Icon" name="check" size="16" stroke-width="2.6" color="var(--text-accent)" dc-props="{{ checkProps }}" hint-size="16px,16px"></x-import>
          <span>{{ extra }}</span>
        </li>
      </ul>
      <button type="button" onClick="{{ book }}" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);width:100%;min-height:var(--tap-min);padding:0 var(--space-5);border:none;border-radius:var(--radius-pill);background:var(--cta-bg);color:var(--cta-fg);font-family:var(--font-body);font-size:var(--type-body);font-weight:var(--fw-bold);cursor:pointer" style-hover="background:var(--cta-bg-hover)" style-active="transform:scale(.975)">
        Записаться к врачу
        <x-import component-from-global-scope="Ds2_2d9e23.Icon" name="arrow-right" size="20" hint-size="20px,20px"></x-import>
      </button>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:440},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Врач-стоматолог&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nameText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Врач-стоматолог&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;speciality&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ортопед, имплантолог&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;experience&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18 лет&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ведёт протезирование под ключ.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extra&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Работает вместе с зубным техником клиники&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photoLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Здесь фото врача&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onBook&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { flipped: false };

  renderVals() {
    const f = this.state.flipped;
    return {
      name: this.props.nameText ?? this.props.name ?? 'Врач-стоматолог',
      speciality: this.props.speciality ?? 'Ортопед',
      experience: this.props.experience ?? '10 лет',
      note: this.props.note ?? 'Ведёт протезирование под ключ.',
      photoLabel: this.props.photoLabel ?? 'Здесь фото врача',
      extra: this.props.extra ?? 'Работает вместе с зубным техником клиники',
      photoProps: { style: { height: '100%', objectFit: 'cover' } },
      checkProps: { style: { marginTop: 3 } },
      flipTransform: f ? 'rotateY(180deg)' : 'rotateY(0deg)',
      backOpacity: f ? 1 : 0,
      backShift: f ? 'translateX(0)' : 'translateX(-10px)',
      flipOn: () => this.setState({ flipped: true }),
      flipOff: () => this.setState({ flipped: false }),
      flipToggle: () => this.setState(s => ({ flipped: !s.flipped })),
      book: (e) => { e.stopPropagation(); this.props.onBook && this.props.onBook(); }
    };
  }
}

</script>
</body>
</html>
