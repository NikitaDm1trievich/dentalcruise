name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Домен и базовый путь сборки. GitHub Pages отдаёт проект из подпапки
# /dentalcruise/, поэтому base подставляется здесь, а не в коде. Переезд
# на хостинг клиники — это замена на SITE=https://dentalcruise.ru и
# BASE=/ здесь же; больше нигде ничего менять не нужно.
#
# Сборка не на dentalcruise.ru считается тестовой: страницы получают
# noindex, robots.txt закрывает обход, шаг IndexNow ниже пропускается.
# Если тестовую сборку нужно намеренно показать поисковикам, добавьте
# сюда строку INDEXABLE: 'true' (см. isIndexable в src/lib/seo.ts).
env:
  SITE: https://nikitadm1trievich.github.io
  BASE: /dentalcruise/

# Нужно, чтобы workflow мог опубликовать сборку в Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: догоняющий деплой отменяет предыдущий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Ошибка типов или шаблона останавливает публикацию до сборки:
      # `astro build` сам их не ловит и выложил бы сломанную страницу.
      - name: Проверка типов и шаблонов
        run: npm run check

      - name: Сборка Astro
        # SITE и BASE приходят из env наверху файла
        env:
          PUBLIC_BOOKING_ENDPOINT: ${{ vars.PUBLIC_BOOKING_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: deployment
        uses: actions/deploy-pages@v4

      # Сообщаем Яндексу и Bing, что сайт обновился: новые страницы
      # попадают в поиск за часы вместо недель. Только с боевого домена:
      # адреса тестовой сборки на github.io поисковикам знать незачем.
      # Шаг не должен ронять публикацию — сайт к этому моменту уже выложен.
      - name: Сообщить поисковикам об обновлении
        if: env.SITE == 'https://dentalcruise.ru'
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ steps.deployment.outputs.page_url }}"
