<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Редактор не должен попадать в поиск -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Дентал Круиз — редактор сайта</title>
    <link rel="icon" href="../favicon.svg" />
    <!-- Конфиг редактора и версия редактора. Сборка дописывает к адресу
         конфига ?v=<отпечаток>, а в content — версию (config.yml +
         preview.js), по которой preview.js замечает, что редактор обновился
         при открытой вкладке (astro.config.mjs). Строки не менять. -->
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
    <meta name="dc-admin-version" content="dev" />
  </head>
  <body>
    <!--
      Sveltia CMS — редактор контента поверх GitHub. Правки сохраняются
      коммитом в репозиторий, после чего GitHub Actions пересобирает сайт
      (примерно 1–2 минуты). Версия закреплена намеренно: обновлять
      осознанно, а не молча ловить изменения в чужом релизе.

      integrity — отпечаток именно этого файла: подменённый на CDN скрипт
      браузер не выполнит, а здесь он работает с токеном GitHub. При смене
      версии хеш пересчитать (без сохранения файла на диск):
        curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.209.1/dist/sveltia-cms.js"
      integrity="sha384-+LjBwm1JrV6L7Nptv96H1C6SYZ0R3HTtHpta0Nuqs9o9Rtr47aPiXZaspb5VTWsM"
      crossorigin="anonymous"
    ></script>
    <!-- Живой предпросмотр: справа настоящая страница сайта вместо списка полей.
         Сборка дописывает к адресу ?v=<отпечаток файла> (astro.config.mjs),
         чтобы браузер не держал старую версию: строку не менять. -->
    <script src="./preview.js"></script>
  </body>
</html>
