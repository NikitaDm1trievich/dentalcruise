<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/fonts.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/colors.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/typography.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/spacing.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/radius.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/elevation.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/motion.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/tokens/base.css">
<link rel="stylesheet" href="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="_ds/2-2d9e23f8-7a30-41dc-bc6f-6fc99fcc0533/_ds_bundle.js"></script>
</helmet>

<div onClick="{{ close }}" style="position:fixed;inset:0;z-index:100;background:rgba(7,59,75,.42);display:flex;align-items:flex-end;justify-content:center;padding:0;transition:opacity var(--dur-mid) var(--ease-out);opacity:{{ scrimOpacity }};pointer-events:{{ pointer }}">
  <section role="dialog" aria-modal="true" aria-label="Лицензия на медицинскую деятельность" onClick="{{ stop }}" style="width:min(520px,100%);max-height:92svh;overflow-y:auto;background:var(--surface-page);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-lg);padding:var(--space-6) var(--space-6) var(--space-8);display:grid;gap:var(--space-6);transition:transform 420ms var(--ease-out);transform:{{ sheetTransform }}">

    <div aria-hidden="true" style="width:56px;height:5px;border-radius:var(--radius-pill);background:var(--dc-sea-glass);justify-self:center"></div>

    <div style="display:grid;gap:var(--space-3);transition:transform 420ms var(--ease-out) 80ms,opacity 420ms var(--ease-out) 80ms;opacity:{{ itemOpacity }};transform:{{ itemShift }}">
      <div style="display:flex;align-items:center;gap:var(--space-3)">
        <span style="display:grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-quiet)">
          <x-import component-from-global-scope="Ds2_2d9e23.Icon" name="shield-check" size="24" color="var(--text-accent)" hint-size="24px,24px"></x-import>
        </span>
        <h2 style="font-size:var(--type-h3);text-transform:uppercase;letter-spacing:var(--ls-display);margin:0">Лицензия</h2>
      </div>
      <p style="color:var(--text-body);font-size:var(--type-body)">Лицензия на осуществление медицинской деятельности выдана на клинику «Дентал Круиз», Москва, 4-я Магистральная, 5с1. Документ можно посмотреть здесь или запросить в клинике.</p>
    </div>

    <div style="transition:transform 420ms var(--ease-out) 150ms,opacity 420ms var(--ease-out) 150ms;opacity:{{ itemOpacity }};transform:{{ itemShift }}">
      <x-import component-from-global-scope="Ds2_2d9e23.PhotoPlaceholder" label="Здесь скан лицензии на медицинскую деятельность" ratio="3 / 4" hint-size="100%,320px"></x-import>
    </div>

    <div style="display:grid;gap:var(--space-3);transition:transform 420ms var(--ease-out) 220ms,opacity 420ms var(--ease-out) 220ms;opacity:{{ itemOpacity }};transform:{{ itemShift }}">
      <x-import component-from-global-scope="Ds2_2d9e23.Button" variant="primary" size="lg" href="#license-pdf" full-width="{{ yes }}" hint-size="100%,56px">Открыть документ</x-import>
      <x-import component-from-global-scope="Ds2_2d9e23.Button" variant="secondary" size="lg" on-click="{{ close }}" full-width="{{ yes }}" hint-size="100%,56px">Закрыть</x-import>
    </div>

  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:760},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this._onKey = (e) => { if (e.key === 'Escape' && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._onKey); }

  renderVals() {
    const open = !!this.props.open;
    return {
      yes: true,
      scrimOpacity: open ? 1 : 0,
      pointer: open ? 'auto' : 'none',
      sheetTransform: open ? 'translateY(0)' : 'translateY(100%)',
      itemOpacity: open ? 1 : 0,
      itemShift: open ? 'translateY(0)' : 'translateY(20px)',
      close: () => this.props.onClose && this.props.onClose(),
      stop: (e) => e.stopPropagation()
    };
  }
}

</script>
</body>
</html>
