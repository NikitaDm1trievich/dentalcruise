                      - { label: 'Главная › Вопросы', value: '/#faq' }
                      - { label: 'Главная › Отзывы', value: '/#reviews' }
                      - { label: 'Главная › Контакты', value: '/#contacts' }
              - { name: contactsTitle, label: Заголовок колонки контактов, widget: string }
          - name: sticky
            label: Нижняя панель на телефоне
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: полоса с кнопками внизу экрана телефона, появляется
              после первого экрана. Кнопка Max пропадает, если ссылки на Max
              нет в контактах.
            fields:
              - { name: call, label: Кнопка звонка, widget: string }
              - { name: book, label: Кнопка записи, widget: string }
              - { name: max, label: Кнопка Max, widget: string }
          - name: crumbsHome
            label: Первая хлебная крошка
            widget: string
            hint: Строка «Главная › …» над заголовком внутренних страниц.

      - name: blocks
        label: Общие блоки
        file: src/data/blocks.json
        fields:
          - name: place
            label: Карточка с адресом
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: карточка перед подвалом и на «Контактах». Адрес,
              режим, почта и телефон в ней — из контактов клиники.
            fields:
              - { name: route, label: Кнопка «Как добраться», widget: string }
              - { name: routeImage, label: Кнопка схемы проезда, widget: string }
              - name: mapLink
                label: Ссылка под картой
                widget: string
                hint: Перед ней сайт пишет короткий адрес и метро.
          - name: license
            label: Окно лицензии
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: окно снизу, открывается плашкой «Лицензия», кнопкой
              на «Контактах» и строкой лицензии в подвале. Номер, дата, орган,
              сканы и выписка — в контактах клиники, группа «Лицензия».
            fields:
              - { name: title, label: Заголовок окна, widget: string }
              - name: issuer
                label: Подпись перед лицензирующим органом
                widget: string
              - name: formerNumber
                label: Подпись перед прежним номером бланка
                widget: string
              - { name: note, label: Текст над сканами, widget: text }
              - { name: scanLabel, label: Надпись вместо скана, widget: string, hint: 'Видна, пока нет ни одного скана.' }
              - { name: open, label: Кнопка выписки из реестра, widget: string, hint: 'Видна, если загружен PDF. Она же — подпись миниатюры в подвале.' }
              - name: registry
                label: Ссылка на реестр
                widget: string
                hint: 'В окне лицензии и в подвале. Видна, если заполнена ссылка на реестр лицензий.'
              - { name: close, label: Кнопка закрытия, widget: string }
          - name: stub
            label: Кнопки страниц-заглушек
            widget: object
            collapsed: true
            hint: >-
              Где на сайте: под текстом страниц «О клинике», «Галерея работ»,
              «Политика конфиденциальности» и 404. Первая кнопка — телефон
              клиники.
            fields:
              - { name: book, label: Кнопка записи, widget: string }
              - { name: home, label: Кнопка «На главную», widget: string }

      - name: form
        label: Форма записи
        file: src/data/form.json
        fields:
          - name: title
            label: Заголовок окна
            widget: string
            hint: >-
              Где на сайте: окно, которое открывают все кнопки «Записаться».
              В предпросмотре справа оно открыто сразу. Сообщения об ошибках
              видны только после публикации — когда форму отправляют.
          - { name: lead, label: Текст под заголовком, widget: text }
          - name: fields
            label: Поля формы
            widget: object
            collapsed: true
            fields:
              - { name: name, label: Подпись поля имени, widget: string }
              - { name: phone, label: Подпись поля телефона, widget: string }
              - { name: phonePlaceholder, label: Пример номера в пустом поле, widget: string }
              - { name: phoneHint, label: Подсказка под телефоном, widget: string }
              - { name: comment, label: Подпись поля комментария, widget: string }
              - { name: consent, label: Текст согласия, widget: string, hint: Дальше идёт ссылка на политику. }
              - { name: consentLink, label: Ссылка на политику, widget: string }
          - { name: submit, label: Кнопка отправки, widget: string }
          - { name: sending, label: Кнопка во время отправки, widget: string }
          - name: fallback
            label: Текст перед телефоном под кнопкой
            widget: string
            hint: Дальше идёт телефон клиники.
          - name: done
            label: Заявка отправлена
            widget: object
            collapsed: true
            hint: Что человек видит после отправки.
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: string, hint: Дальше сайт дописывает режим работы коротко. }
              - { name: call, label: Кнопка звонка, widget: string }
              - { name: max, label: Кнопка Max, widget: string }
          - name: errors
            label: Сообщения об ошибках
            widget: object
            collapsed: true
            hint: Видны, только если что-то пошло не так.
            fields:
              - { name: name, label: Не указано имя, widget: string }
              - { name: phone, label: Неполный телефон, widget: string }
              - { name: consent, label: Нет согласия, widget: string }
              - { name: offline, label: Нет интернета, widget: string }
              - { name: noEndpoint, label: Форма не подключена, widget: string }
              - { name: timeout, label: Сервер не ответил, widget: string }
              - { name: generic, label: Другая ошибка, widget: string }

  # ── Цвета сайта ──────────────────────────────────────────────────────
  # Правится только фирменная часть палитры. Остальные оттенки (белый фон,
  # оттенки границ) считаются от неё в styles/tokens/colors.css и меняться
  # владельцем не должны. Сборка проверяет контраст и пишет предупреждение
  # в лог, если сочетание становится нечитаемым.
  - name: theme
    label: Цвета сайта
    icon: palette
    files:
      - name: palette
        label: Цвета сайта
        file: src/data/theme.json
        fields:
          - name: accent
            label: Фирменный цвет
            widget: object
            hint: >-
              Справа сразу видно, как цвет ложится на страницу. После
              сохранения цвета меняются на всём сайте. Сборка предупредит, если
              текст станет плохо читаться.
            fields:
              - name: ink
                label: Кнопки и ссылки
                widget: color
                allowInput: true
                hint: Заливка кнопок записи, цвет ссылок и цен. Текст на кнопке белый.
              - { name: press, label: Кнопка при наведении, widget: color, allowInput: true }
              - name: base
                label: Иконки, звёзды, рамки
                widget: color
                allowInput: true
                hint: Светлый фирменный оттенок. Кнопки им не красятся.
              - name: soft
                label: Бледный фирменный фон
                widget: color
                allowInput: true
                hint: Бледно-зелёные подложки и тонкие рамки.
              - { name: mark, label: Знак в логотипе, widget: color, allowInput: true }
          - name: promo
            label: 'Красный: акции и ошибки'
            widget: object
            hint: >-
              Ленточки «Акция», метки акций в прайсе, подсветка ошибок в форме
              записи. Текст на нём белый, поэтому нужен насыщенный красный.
            fields:
              - { name: base, label: Основной красный, widget: color, allowInput: true }
              - { name: press, label: 'Темнее, при наведении', widget: color, allowInput: true }
              - { name: soft, label: Бледная красная подложка, widget: color, allowInput: true }
          - name: ink
            label: Цвет текста
            widget: object
            hint: Тёмные оттенки. Светлые сделают сайт нечитаемым.
            fields:
              - { name: heading, label: Заголовки, widget: color, allowInput: true }
              - { name: body, label: Основной текст, widget: color, allowInput: true }
              - { name: muted, label: Подписи и второстепенный текст, widget: color, allowInput: true }
          - name: dark
            label: Тёмные блоки
            widget: object
            fields:
              - { name: base, label: Фон тёмных блоков, widget: color, allowInput: true }
              - { name: lift, label: Верх градиента тёмных блоков, widget: color, allowInput: true }
              - { name: footer, label: Фон подвала, widget: color, allowInput: true }
          - name: tint
            label: Подложки секций
            widget: object
            hint: Очень светлые оттенки, на них идёт основной текст.
            fields:
              - name: warm
                label: Тёплая подложка
                widget: color
                allowInput: true
                hint: Блоки «7. Почему мы», «9. О клинике», часть страниц врача, услуги и контактов.
              - name: cool
                label: Холодная подложка
                widget: color
                allowInput: true
                hint: Блоки «8. Полоса доверия», «10. Вопросы», верх блока «2. Условия».
              - name: aqua
                label: Мятная подложка
                widget: color
                allowInput: true
                hint: Низ блока «4. Услуги», карточки условий, плашки полосы доверия, блок «Контакты».
              - name: breeze
                label: Голубая подложка
                widget: color
                allowInput: true
                hint: Фон под виджетом отзывов Яндекса и под фото, пока оно грузится.

  # ── Поиск и счётчики ─────────────────────────────────────────────────
  # Коды подтверждения прав на сайт и ключ быстрой индексации. Всё здесь
  # выдают сами сервисы — придумывать значения нельзя: неверный код просто
  # не подтвердит права, а неверный ключ IndexNow отключит быструю
  # индексацию. Пустое поле ничего не выводит на сайт. Своей страницы у
  # этих кодов нет, поэтому предпросмотр выключен и форма во всю ширину.
  - name: seo
    label: Поиск и счётчики
    icon: search
    editor:
      preview: false
    files:
      - name: settings
        label: Коды Яндекса, Google и Метрики
        file: src/data/seo.json
        fields:
          - name: verification
            label: Подтверждение прав на сайт
            widget: object
            fields:
              - name: yandex
                label: Яндекс Вебмастер
                widget: string
                required: false
                hint: >-
                  Код из webmaster.yandex.ru → «Добавить сайт» → «Мета-тег».
                  Вставьте только значение content, без самого тега.
              - name: google
                label: Google Search Console
                widget: string
                required: false
                hint: >-
                  Код из search.google.com/search-console, способ
                  «HTML-тег». Только значение content.
              - name: mailru
                label: Вебмастер Mail.ru
                widget: string
                required: false
                hint: Нужен, только если добавляете сайт в поиск Mail.ru.
          - name: metrikaId
            label: Номер счётчика Метрики
            widget: string
            required: false
            hint: >-
              Только цифры номера счётчика. Метрика нужна для Яндекс
              Бизнеса и для отчётов по посещаемости.
          - name: region
            label: Регион работы
            widget: object
            hint: >-
              По этим словам поисковик понимает, где вас искать. Меняйте,
              только если клиника переехала.
            fields:
              - { name: city, label: Город, widget: string }
              - { name: district, label: Район, widget: string }
              - name: landmarks
                label: Ориентиры рядом
                widget: text
                hint: Метро и районы через запятую — по ним ищут «стоматология рядом».
          - name: indexNowKey
            label: 'Служебное: ключ быстрой индексации'
            widget: string
            required: false
            hint: >-
              Ускоряет попадание новых страниц в Яндекс и Bing. Заполняется
              один раз при настройке: строка из 8–128 латинских букв и цифр,
              сайт сам выложит файл с этим ключом. Если уже заполнен, не
              меняйте.

  # ── Работы до/после ──────────────────────────────────────────────────
  # Скрыто из меню, пока /gallery — заглушка: правки здесь ни на что на
  # сайте не влияют. Вернуть в меню (убрать hide), когда галерея заработает.
  - name: cases
    label: Работы до и после
    icon: photo_library
    hide: true
    folder: src/content/cases
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    fields:
      - { name: title, label: Название работы, widget: string }
      - { name: before, label: Фото «до», widget: image }
      - { name: after, label: Фото «после», widget: image }
      - { name: note, label: Комментарий, widget: text, required: false }
      - name: order
        label: Порядок на странице
        widget: number
        value_type: int
        default: 100
        hint: >-
          Чем меньше число, тем выше. Удобно шагом 10: 10, 20, 30 — так можно
          вставить запись между соседними.
      - name: category
        label: 'Служебное: тип работ'
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Только латинские буквы в нижнем регистре, цифры и дефис']
        hint: crowns, implants или veneers — от этого зависит фильтр в галерее.
