            fields:
              - { name: text, label: Текст под логотипом, widget: text }
              - { name: pagesTitle, label: Заголовок первой колонки, widget: string }
              - name: pages
                label: Ссылки первой колонки
                label_singular: ссылка
                widget: list
                collapsed: true
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Подпись, widget: string }
                  - name: href
                    label: Страница
                    widget: select
                    options:
                      - { label: Главная, value: / }
                      - { label: Прайс-лист, value: /pricelist }
                      - { label: О клинике, value: /about }
                      - { label: Врачи, value: /doctors }
                      - { label: Галерея работ, value: /gallery }
                      - { label: Контакты, value: /contacts }
                      - { label: Политика конфиденциальности, value: /privacy }
                      - { label: 'Главная › Акции', value: '/#promo' }
                      - { label: 'Главная › Услуги', value: '/#services' }
                      - { label: 'Главная › Врачи', value: '/#doctors' }
                      - { label: 'Главная › Почему мы', value: '/#why' }
                      - { label: 'Главная › О клинике', value: '/#about' }
                      - { label: 'Главная › Вопросы', value: '/#faq' }
                      - { label: 'Главная › Отзывы', value: '/#reviews' }
                      - { label: 'Главная › Контакты', value: '/#contacts' }
              - { name: infoTitle, label: Заголовок второй колонки, widget: string }
              - name: info
                label: Ссылки второй колонки
                label_singular: ссылка
                widget: list
                collapsed: true
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Подпись, widget: string }
                  - name: href
                    label: Страница
                    widget: select
                    options:
                      - { label: Главная, value: / }
                      - { label: Прайс-лист, value: /pricelist }
                      - { label: О клинике, value: /about }
                      - { label: Врачи, value: /doctors }
                      - { label: Галерея работ, value: /gallery }
                      - { label: Контакты, value: /contacts }
